<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Estética Duda | Especialista em Limpeza de Pele - Nova Mutum MT{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Tratamentos faciais exclusivos e limpeza de pele profunda em Nova Mutum - MT. Recupere o viço, luminosidade e saúde da sua pele.{% endblock %}">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
